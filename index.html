<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday 💗</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, serif;
            background: linear-gradient(135deg, #ffd6e7, #fff0f6);
            color: #5a3045;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            padding: 50px 25px;
        }

        .heart {
            font-size: 70px;
            animation: heartbeat 1.5s infinite;
        }

        h1 {
            font-size: 3rem;
            margin: 15px 0;
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 35px;
        }

        button {
            background: #e75480;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            background: #d63d6d;
            transform: scale(1.05);
        }

        #message {
            display: none;
            margin-top: 35px;
            background: rgba(255, 255, 255, 0.7);
            padding: 30px;
            border-radius: 20px;
            line-height: 1.7;
            box-shadow: 0 10px 30px rgba(150, 70, 100, 0.15);
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">💗</div>

        <h1>Happy Birthday!</h1>

        <p class="subtitle">
            I made you a little something...
        </p>

        <button onclick="openSurprise()">
            Open Your Surprise 💌
        </button>

        <div id="message">
            <h2>For Someone Very Special 💕</h2>

            <p>
                Your birthday deserves more than just a text message,
                so I decided to make you something.
            </p>

            <p>
                This is only the beginning...
                there's more waiting for you. ✨
            </p>
        </div>

    </div>

    <script>
        function openSurprise() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
